.pages{display:flex;justify-content:center;gap:8px;padding:12px}

.pages button:active{background:#1a237e;color:#fff}
.pages span{padding:8px;font-size:.85rem}
.empty{text-align:center;padding:60px 20px;color:#999}
.footer{text-align:center;padding:16px;font-size:.7rem;color:#bbb}

DATA.sort(function(a,b){return (a.s||'').localeCompare(b.s||'')||(a.m||'').localeCompare(b.m||'')});

var page=0, PS=30;

// 初始化品牌筛选
(function(){
  var bs={};
  DATA.forEach(function(v){
    var b=v.s.split(' ')[0];
    if(b)bs[b]=1;
  });
  var sel=document.getElementById('fb');
  Object.keys(bs).sort().forEach(function(b){
    var o=document.createElement('option');
    o.value=b;o.textContent=b;sel.appendChild(o);
  });
})();

function render(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var fb=document.getElementById('fb').value;
  var fd=DATA;
  if(q)fd=fd.filter(function(v){return(v.s+' '+v.m+' '+v.v+' '+v.e).toLowerCase().indexOf(q)>=0});
  if(fb)fd=fd.filter(function(v){return v.s.indexOf(fb)===0});

  // Stats
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="v">'+fd.length+'</div><div class="l">匹配结果</div></div>'+
    '<div class="stat"><div class="v">'+DATA.length+'</div><div class="l">总报价数</div></div>';

  // 分页
  var total=fd.length, start=page*PS, items=fd.slice(start,start+PS);
  var list=document.getElementById('list'), empty=document.getElementById('empty');

  if(!items.length){list.innerHTML='';empty.style.display='block'}else{empty.style.display='none'}

  var ps='';
  var html='';
  items.forEach(function(v){
    if(v.s!==ps){html+='<div class="gh">'+esc(v.s)+'</div>';ps=v.s}
    var fob=v.f!=null?v.f.toLocaleString():'-';
    var guide=v.g!=null?v.g.toLocaleString():null;
    var us=v.u==='USD'?'$':'¥';
    var tt=v.t==='CIF'?'<span class="tag t-cif">CIF</span>':v.t==='EXW'?'<span class="tag t-fob">EXW</span>':'<span class="tag t-fob">FOB</span>';
    var ut=v.u==='USD'?'<span class="tag u-usd">USD</span>':'<span class="tag u-rmb">RMB</span>';
    html+=
      '<div class="card">'+
        '<div class="top"><span class="m">'+esc(v.m||'-')+'</span><span class="fob">'+us+fob+'</span></div>'+
        '<div class="info">'+
          (v.v?'<span>'+esc(v.v)+'</span>':'')+
          (v.e?'<span>'+esc(v.e)+'</span>':'')+
          tt+ut+
          (v.p?'<span>'+esc(v.p)+'</span>':'')+
          (guide?'<span class="guide">'+us+guide+'</span>':'')+
        '</div>'+
        (v.c?'<div class="info" style="margin-top:2px"><span>🎨 '+esc(v.c)+'</span></div>':'')+
      '</div>';
  });
  list.innerHTML=html;

  // 分页器
  var tp=Math.ceil(total/PS);
  var pg=document.getElementById('pages');
  if(tp<=1){pg.innerHTML='';return}
  pg.innerHTML=
    '<button '+(page<=0?'disabled':'')+' onclick="page=Math.max(0,page-1);render();window.scrollTo(0,0)">‹</button>'+
    '<span>'+ (page+1)+'/'+tp+'</span>'+
    '<button '+(page>=tp-1?'disabled':'')+' onclick="page=Math.min('+(tp-1)+',page+1);render();window.scrollTo(0,0)">›</button>';
}
